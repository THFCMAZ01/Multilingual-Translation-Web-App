name: Build LinguaSwift Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-37.0"
      - name: Add Android 37 platform alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LinguaSwift-debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
